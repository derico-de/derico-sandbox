[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sandboxsh"
version = "0.1.0"
description = "Persistent, security-oriented Incus VM development sandboxes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sandboxsh contributors" }]
dependencies = ["click>=8.1,<9"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sandboxsh = "sandboxsh.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/sandboxsh"]

[tool.hatch.build.targets.wheel.force-include]
"guest" = "sandboxsh/guest"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
